[package]
name = "schemars_foxy"
version = "0.2.0"
edition = "2024"

[lib]
path = "src/lib.rs"
name = "schemars_foxy"

[dependencies]
indexmap = {"version" = "2.9", features = ["serde"]}
log = "0.4"
rustfmt-wrapper = "0.2"
serde = "1.0"
serde_json = "1.0"

[dev-dependencies]
colog = "1.3"
glob = "0.3"
pretty_assertions = "1.4"

[lints.clippy]
print_stdout = "deny"
print_stderr = "deny"
