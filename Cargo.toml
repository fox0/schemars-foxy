[package]
name = "schemars_foxy"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"
name = "schemars_foxy"

[dependencies]
indexmap = "2.9"
rustfmt-wrapper = "0.2"
schemars = { version = "0.8", features = ["preserve_order"] }
serde = "1.0"
serde_json = "1.0"

[dev-dependencies]
glob = "0.3"
pretty_assertions = "1.4"

[lints.clippy]
print_stdout = "deny"
print_stderr = "deny"
